<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logged Out - Easy Loan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/styles.css">
</head>
<body class="login-page">
  <main class="login-page-wrap">
    <section class="login-panel logout-panel" aria-labelledby="logout-title">
      <div class="login-brand-lockup">
        <a class="brand login-brand" href="landing.html" aria-label="Easy Loan home">
          <span class="material-symbols-outlined brand-icon" aria-hidden="true">account_balance</span>
          <span>Easy Loan</span>
        </a>
        <p>Session Closed</p>
      </div>

      <div class="logout-icon" aria-hidden="true">
        <span class="material-symbols-outlined">logout</span>
      </div>

      <h2 id="logout-title">You are logged out</h2>
      <p class="login-copy">Your session has ended safely. Sign in again to manage your loans, payments, and account details.</p>

      <div class="logout-actions">
        <a class="btn btn-block login-submit" href="login.html">
          <span>Login Again</span>
          <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
        </a>
        <a class="btn-secondary create-button" href="landing.html">Back to Home</a>
      </div>
    </section>

    <footer class="login-footer">
      <p>&copy; 2024 Easy Loan Financial. Secure &amp; Regulated.</p>
      <div>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
      </div>
    </footer>
  </main>
</body>
</html>
